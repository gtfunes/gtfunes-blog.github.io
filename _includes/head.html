<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://*.googletagmanager.com https://{{ site.disqus.shortname }}.disqus.com https://c.disquscdn.com; style-src 'self'; img-src 'self' https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src https://*.disqus.com; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    {%- if page.noindex %}<meta name="robots" content="noindex" />{% endif -%}
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {%- seo -%} <link rel="stylesheet" href="{{ "/assets/main.css" |
    relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/theme.css" | relative_url }}">
    <meta name="theme-color" content="#fdfdfd">
    <script src="{{ "/assets/theme-init.js" | relative_url }}"></script>
    <script defer src="{{ "/assets/theme-toggle.js" | relative_url }}"></script>
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    {%- feed_meta -%} {%- if jekyll.environment == 'production' and
    site.google_analytics -%} {%- include google-analytics.html -%} {%- endif
    -%}
</head>
